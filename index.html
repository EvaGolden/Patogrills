<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <link rel="icon" type="image/png" href="logo.png">

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    /* ===== YOUR EXISTING STYLES – kept exactly as before ===== */
    :root {
      --fire: #f2622e;
      --fire-deep: #c84318;
      --fire-light: #ff9142;
      --black: #0d0a08;
      --charcoal: #1a1410;
      --cream: #fff8f2;
      --warm-white: #fffaf6;
      --text-main: #1a1410;
      --text-muted: #7a6255;
      --border: rgba(242,98,46,0.15);
      --nav-h: 68px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --BF: 'Bebas Neue', impact, sans-serif;
      --DF: 'DM Sans', system-ui, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { scroll-behavior:smooth; }
    body {
      font-family: var(--DF);
      background: var(--warm-white);
      color: var(--text-main);
      overflow-x: hidden;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px);
    }
    /* Onboarding, top bar, hero, pages – all unchanged – omitted here for brevity but present in full code */
    /* (To keep this answer readable, the complete style block is included in the final delivery) */
    .install-hero-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: white; color: var(--fire); border: none;
      padding: 8px 18px; border-radius: 40px; font-weight: bold;
      font-size: 0.8rem; margin-top: 12px; cursor: pointer;
      font-family: var(--BF); letter-spacing: 1px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .install-hero-btn:hover { transform: scale(1.02); background: #fff0e8; }
    .debug-panel {
      position: fixed; bottom: 80px; left: 10px;
      background: #1a1a2e; color: #0f0; font-family: monospace;
      font-size: 0.7rem; padding: 6px 10px; border-radius: 8px;
      z-index: 9999; opacity: 0.7; cursor: pointer; max-width: 200px;
    }
    .debug-panel:hover { opacity: 1; }
    /* All other existing styles (menu, cart, rider, track, etc.) are preserved */
  </style>
</head>
<body>

<!-- ONBOARDING (same as before) -->
<div id="onboarding">...</div>
<!-- TOP BAR (same) -->
<header class="top-bar">...</header>
<!-- HERO with install button -->
<div class="hero">...</div>
<!-- PAGE: MENU, CART, ORDER, TRACK (exactly as in your original) -->
<!-- ... -->
<!-- BOTTOM NAV, RIDER MODAL, DEBUG PANEL (same) -->
<div id="debugPanel" class="debug-panel" onclick="copyDebugInfo()">...</div>

<script>
  // ==================== FIREBASE CONFIG ====================
  const firebaseConfig = {
    apiKey: "AIzaSyDNZUtiUoEuV6cqF90144wqwsGAFERnsuw",
    authDomain: "tracking-61ea4.firebaseapp.com",
    databaseURL: "https://tracking-61ea4-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "tracking-61ea4",
    storageBucket: "tracking-61ea4.firebasestorage.app",
    messagingSenderId: "397920553801",
    appId: "1:397920553801:web:8326ae436c7fa169a46898"
  };
  firebase.initializeApp(firebaseConfig);
  const rtdb = firebase.database();

  // ==================== GLOBAL VARIABLES ====================
  let cart = [], OT = "Delivery", actCat = "ALL", menuItems = [];
  const FEE = 1000, PH = "2348029811578";
  let riderSharing = false, riderWatchId = null, riderCurrentOrderId = null;
  let pendingOrdersListener = null, trackMap = null, trackOrderRef = null;
  const OFFLINE_TIMEOUT = 60000;

  function toast(m) { const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1900); }
  const fmt = n => "₦" + n.toLocaleString();
  function generateOrderId() { const now=new Date(); const dateStr=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0'); const rand=Math.floor(Math.random()*9000)+1000; return `PAT-${dateStr}-${rand}`; }
  const ORDER_ID = generateOrderId();
  document.getElementById('orderIdDisplay').textContent = ORDER_ID;
  window.copyOrderId = () => { navigator.clipboard.writeText(ORDER_ID); toast("✅ Order ID copied!"); };
  const sub = () => cart.reduce((s,i)=>s + i.price * i.qty, 0);
  const tot = () => sub() + (OT === "Delivery" && cart.length ? FEE : 0);
  function updBadge() { const n=cart.reduce((s,i)=>s+i.qty,0); document.getElementById("cartCount").textContent=n; const b=document.getElementById("navBadge"); if(b) b.style.display=n>0?"flex":"none"; if(b) b.textContent=n; }

  // ==================== MENU ====================
  const DEFAULT_MENU = [
    {id:1,name:"Spaghetti", price:1500,desc:"Classic pasta, rich tomato sauce", cat:"MAINS", img:"Spaghetti.jpg", stock:99},
    {id:2,name:"Chips (Fries)", price:1500,desc:"Golden crispy fries", cat:"MAINS", img:"chip.jpg", stock:99},
    {id:3,name:"Sharp Wrap", price:3500,desc:"Shawarma wrap, garlic sauce", cat:"MAINS", img:"shawarma.jpg", stock:99},
    {id:4,name:"Sabi Talk Turkey", price:6000,desc:"Jumbo turkey, smoky glaze", cat:"PROTEINS", img:"turk.jpg", stock:99},
    {id:5,name:"Talkless Turkey", price:4000,desc:"Small turkey, well-spiced", cat:"PROTEINS", img:"trk.jpg", stock:99},
    {id:6,name:"Big Chicken", price:5000,desc:"Full grilled chicken", cat:"PROTEINS", img:"chick.jpg", stock:99},
    {id:7,name:"Small Chicken", price:3500,desc:"Half chicken", cat:"PROTEINS", img:"chken.jpg", stock:99},
    {id:8,name:"Sausage", price:500, desc:"Smoky grilled sausage", cat:"EXTRAS", img:"suss.png", stock:99},
    {id:9,name:"Fresh Salad", price:700, desc:"Crunchy veggie mix", cat:"EXTRAS", img:"salad.jpg", stock:99}
  ];

  async function loadMenuFromFirebase() {
    const snap = await rtdb.ref('menu').once('value');
    const fbMenu = snap.val();
    if (fbMenu) menuItems = Object.values(fbMenu);
    else { menuItems = DEFAULT_MENU; for (let item of menuItems) await rtdb.ref('menu/' + item.id).set(item); }
    buildMenu();
  }

  function buildMenu() {
    const cats = actCat === "ALL" ? ["MAINS","PROTEINS","EXTRAS"] : [actCat];
    const CL = {MAINS:"🍝 Mains", PROTEINS:"🍗 Proteins", EXTRAS:"🥗 Extras"};
    let h = "";
    for (const c of cats) {
      const items = menuItems.filter(i => i.cat === c);
      if (!items.length) continue;
      h += `<div class="sec-title">${CL[c]}</div><div class="menu-grid">`;
      items.forEach(i => { 
        const isOutOfStock = i.stock <= 0;
        h += `<div class="menu-card">
          <img class="menu-img" src="${i.img}" onerror="this.src='https://placehold.co/400x250/fef0e6/f2622e?text=🔥'">
          <div class="menu-info">
            <div class="menu-name">${i.name} ${isOutOfStock ? '<span style="background:#ef4444; color:white; font-size:0.65rem; padding:2px 8px; border-radius:20px; margin-left:8px;">SOLD OUT</span>' : ''}</div>
            <div class="menu-desc">${i.desc}</div>
            <div class="menu-bottom">
              <div class="menu-price">${fmt(i.price)}</div>
              <button class="order-btn" onclick="addItem(${i.id})" ${isOutOfStock ? 'disabled' : ''}>
                <i class="fas fa-shopping-cart"></i> ${isOutOfStock ? 'UNAVAILABLE' : 'ORDER'}
              </button>
            </div>
            <small style="font-size:0.65rem;">stock: ${i.stock}</small>
          </div>
        </div>`; 
      });
      h += "</div>";
    }
    document.getElementById("menuContent").innerHTML = h;
  }

  window.addItem = (id) => { 
    const it = menuItems.find(i=>i.id===id); 
    if(it.stock <= 0) { toast("❌ Sorry, " + it.name + " is out of stock!"); return; } 
    const ex = cart.find(i=>i.id===id); 
    if(ex) {
      if(ex.qty >= it.stock) { toast(`❌ Only ${it.stock} ${it.name}(s) available!`); return; }
      ex.qty++; 
    } else cart.push({...it, qty:1}); 
    updBadge(); toast("✅ " + it.name + " added to cart!"); 
  };
  
  window.updateQty = (id,d) => { 
    const idx=cart.findIndex(i=>i.id===id); if(idx===-1) return; 
    const item = menuItems.find(i=>i.id===id);
    const newQty = cart[idx].qty + d;
    if(newQty > item.stock) { toast(`❌ Only ${item.stock} ${item.name}(s) available!`); return; }
    cart[idx].qty+=d; if(cart[idx].qty<=0) cart.splice(idx,1); updBadge(); renderCart(); updPreview(); 
  };
  
  function renderCart() { 
    const el=document.getElementById("cartContent"), sm=document.getElementById("cartSummary"), cw=document.getElementById("chkWrap"); 
    if(!cart.length){ 
      el.innerHTML=`<div class="cart-empty"><i class="fas fa-bag-shopping"></i><h3>CART IS EMPTY</h3><p>Go to Menu and tap ORDER to add items!</p></div>`; 
      sm.style.display="none"; cw.innerHTML=""; return; 
    } 
    el.innerHTML=`<div class="cart-list">${cart.map(it=>`<div class="cart-item"><img class="ci-img" src="${it.img}" onerror="this.src='https://placehold.co/100x100/fef0e6/f2622e?text=🔥'"><div class="ci-info"><div class="ci-name">${it.name}</div><div class="ci-unit">${fmt(it.price)} each</div><div class="qty-row"><button class="qty-btn" onclick="updateQty(${it.id},-1)">−</button><span class="qty-num">${it.qty}</span><button class="qty-btn" onclick="updateQty(${it.id},1)">+</button></div></div><div class="ci-price">${fmt(it.price*it.qty)}</div></div>`).join("")}</div>`; 
    const isD=OT==="Delivery"; 
    document.getElementById("sSub").textContent=fmt(sub()); 
    document.getElementById("dRow").style.display=isD?"flex":"none"; 
    document.getElementById("sTotal").textContent=fmt(tot()); 
    sm.style.display="block"; 
    cw.innerHTML=`<button class="wa-btn" onclick="goTo('order')"><i class="fas fa-receipt"></i> FILL ORDER DETAILS</button>`; 
  }

  // ==================== ENHANCED ORDER SAVE (reliable) ====================
  // Capture location only for delivery
  function captureCustomerLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) reject("Geolocation not supported");
      document.getElementById("locationStatus").innerHTML = `<i class="fas fa-spinner fa-spin"></i> Getting your location...`;
      navigator.geolocation.getCurrentPosition(
        pos => {
          document.getElementById("locationStatus").innerHTML = `✅ Location captured!`;
          resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        },
        err => {
          let msg = err.code === 1 ? "Location permission denied. Please enable GPS for delivery orders." : "Location unavailable.";
          document.getElementById("locationStatus").innerHTML = `⚠️ ${msg}`;
          reject(msg);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
  }

  // Save order to Firebase – returns true/false
  async function saveOrderToRTDB(customerCoords) {
    if (!cart.length) { toast("❌ Cart empty"); return false; }
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = OT === "Delivery" ? document.getElementById("address").value.trim() : "";
    const notes = document.getElementById("notes").value.trim();
    if (!name || !phone) { toast("❌ Name and phone required"); return false; }
    if (OT === "Delivery" && !address) { toast("📍 Please enter your delivery address"); return false; }

    const orderData = {
      orderId: ORDER_ID,
      customerName: name,
      phone: phone,
      orderType: OT,
      address: address,
      notes: notes,
      items: cart.map(i => ({ name: i.name, price: i.price, qty: i.qty, total: i.price * i.qty })),
      total: tot(),
      status: "pending",
      timestamp: Date.now(),
      assigned: false,
      riderLocation: null,
      customerLocation: customerCoords ? { latitude: customerCoords.lat, longitude: customerCoords.lng, timestamp: Date.now() } : null
    };

    try {
      await rtdb.ref('orders/' + ORDER_ID).set(orderData);
      toast("✅ Order saved! Track via Track tab.");
      return true;
    } catch (err) {
      console.error("Firebase save error:", err);
      toast("❌ Failed to save order: " + (err.message || "Check network or Firebase rules"));
      return false;
    }
  }

  // WhatsApp handler – save first, then open WhatsApp
  document.getElementById("sendLink").addEventListener("click", async (e) => {
    e.preventDefault();
    if (!cart.length) { toast("🍽️ Add items first!"); return; }
    if (OT === "Delivery" && !document.getElementById("address").value.trim()) {
      toast("📍 Please enter your delivery address");
      return;
    }

    let coords = null;
    if (OT === "Delivery") {
      try {
        coords = await captureCustomerLocation();
      } catch (err) {
        toast("⚠️ Location error: " + err + ". Try Pickup or enable GPS.");
        return;
      }
    }

    const saved = await saveOrderToRTDB(coords);
    if (!saved) {
      // Save failed – do NOT open WhatsApp
      return;
    }

    // Save succeeded – now open WhatsApp
    const waLink = `https://wa.me/${PH}?text=${encodeURIComponent(genMsg())}`;
    window.open(waLink, '_blank');
  });

  // Preview and other helpers remain the same
  function genMsg() { /* unchanged – same as before */ }
  function updPreview() { /* unchanged */ }
  window.selOT = type => { /* unchanged */ };

  // ==================== RIDER PANEL, TRACKING, PWA, ADMIN (all unchanged) ====================
  // ... (all existing rider, tracking, PWA install, admin triple-click functions remain as they were)
  // To keep this answer within length limits, I’ve kept only the critical fixes.
  // The complete working file will be provided in the final message.

  // ==================== FIREBASE TEST & DEBUG ====================
  async function testFirebaseConnection() {
    const statusSpan = document.getElementById('firebaseStatus');
    try {
      await rtdb.ref('test_connection').set({ timestamp: Date.now(), status: 'connected' });
      statusSpan.innerHTML = '✅ Connected';
      statusSpan.style.color = '#0f0';
    } catch (error) {
      statusSpan.innerHTML = '❌ Error';
      statusSpan.style.color = '#f00';
      toast('⚠️ Firebase connection failed. Check rules or network.');
    }
  }

  async function updateVisitorCount() {
    if (!sessionStorage.getItem('visitor_counted')) {
      try {
        const visitorRef = rtdb.ref('visitors/count');
        const snap = await visitorRef.once('value');
        let current = snap.val() || 0;
        current++;
        await visitorRef.set(current);
        sessionStorage.setItem('visitor_counted', 'true');
        document.getElementById('visitorDebug').innerText = current;
      } catch(e) { console.error(e); }
    } else {
      const snap = await rtdb.ref('visitors/count').once('value');
      document.getElementById('visitorDebug').innerText = snap.val() || 0;
    }
  }

  async function updateOrderCountDebug() {
    try {
      const snap = await rtdb.ref('orders').once('value');
      const count = snap.val() ? Object.keys(snap.val()).length : 0;
      document.getElementById('orderCountDebug').innerText = count;
    } catch(e) { console.error(e); }
  }

  function copyDebugInfo() {
    const info = `Firebase: ${document.getElementById('firebaseStatus').innerText}\nVisitors: ${document.getElementById('visitorDebug').innerText}\nOrders: ${document.getElementById('orderCountDebug').innerText}`;
    navigator.clipboard.writeText(info);
    toast('📋 Debug info copied');
  }

  // ==================== INITIALIZE ====================
  window.goTo = (p) => { /* same as before */ };
  document.querySelectorAll('.cat-pill').forEach(p => p.addEventListener('click', () => { /* same */ }));
  const togglePickup = document.getElementById("togglePickupBtn"), toggleDelivery = document.getElementById("toggleDeliveryTrackBtn");
  // ... existing init code ...

  (async () => {
    await testFirebaseConnection();
    await updateVisitorCount();
    await updateOrderCountDebug();
    await loadMenuFromFirebase();
    renderCart();
    selOT("Delivery");
    if (Notification.permission === "default") Notification.requestPermission();
  })();
</script>
</body>
